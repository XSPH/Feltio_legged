# dogsim always loads this file automatically. Relative paths are resolved
# from the directory containing this file.

model:
  path: ../models/policy.mnn
  input_size: 225
  output_size: 12
  num_threads: 2

simulation:
  # Go2: ../models/go2/stairs.xml
  # TOE_dog4.5: ../../resources/robots/TOE_dog4.5/xml/scene.xml
  scene: ../../resources/robots/TOE_dog4.5/xml/scene.xml
  timestep: 0.005
  decimation: 4
  render_hz: 60.0
  initial_base_height: 0.42

controller:
  action_scale: 0.25
  hip_reduction: 0.5
  stiffness: 20.0
  damping: 0.5
  stand_duration: 2.0
  clip_observations: 100.0
  clip_actions: 100.0
  default_joint_angles:
    - 0.0
    - 0.8
    - -1.5
    - 0.0
    - 0.8
    - -1.5
    - 0.0
    - 1.0
    - -1.5
    - 0.0
    - 1.0
    - -1.5

observation_scales:
  angular_velocity: 0.25
  joint_position: 1.0
  joint_velocity: 0.05
  command_linear: 2.0
  command_yaw: 0.25

commands:
  max_linear_x: 1.0
  max_linear_y: 1.0
  max_angular_z: 1.0
  deadzone: 0.08

joystick:
  device: /dev/input/js0
