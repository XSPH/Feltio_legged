# dogsim always loads this file automatically. Relative paths are resolved
# from the directory containing this file.

fel:
  model_path: ../models/policy.mnn
  model_input_size: 225
  model_output_size: 12
  model_num_threads: 2

  default_dof_pos:
    - 0.0
    - 0.8
    - -1.5
    - 0.0
    - 0.8
    - -1.5
    - 0.0
    - 1.0
    - -1.5
    - 0.0
    - 1.0
    - -1.5

  scale_ang_vel: 0.25
  scale_lin_vel_x: 2.0
  scale_lin_vel_y: 2.0
  scale_dof_pos: 1.0
  scale_dof_vel: 0.05

  observation_clamp: 100.0
  action_clamp: 100.0
  actions_scale: 0.25
  hip_reduction: 0.5
  stand_duration: 2.0
  speed_ramp_step: 0.05

  num_proprio: 45
  history_len: 5
  num_actions: 12

  sim_rl_gain:
    Kp: [20.0, 20.0, 20.0]
    Kd: [0.5, 0.5, 0.5]
  sim_stance_gain:
    Kp: [30.0, 50.0, 60.0]
    Kd: [0.75, 1.25, 1.5]

simulation:
  # Go2: ../models/go2/stairs.xml
  # TOE_dog4.5: ../../resources/robots/TOE_dog4.5/xml/scene.xml
  scene: ../../resources/robots/TOE_dog4.5/xml/scene.xml
  timestep: 0.005
  decimation: 4
  render_hz: 60.0
  initial_base_height: 0.42

commands:
  max_linear_x: 1.0
  max_linear_y: 1.0
  max_angular_z: 1.0
  deadzone: 0.08

joystick:
  device: /dev/input/js0
